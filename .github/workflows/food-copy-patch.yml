name: Enable past meal copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/food-copy-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch past meal copy UI
        run: python3 .github/scripts/food-copy-patch.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js sw.js
          git commit -m "Add past meal copy feature"
          git push
